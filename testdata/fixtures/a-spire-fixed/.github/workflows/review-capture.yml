name: Capture review
on:
  pull_request_review:
    types: [submitted]
permissions: {}
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Write review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          jq -n --argjson pr "$PR_NUMBER" --arg state "$REVIEW_STATE" '{pr: $pr, state: $state}' > review.json
      - name: Upload review
        uses: actions/upload-artifact@v7
        with:
          name: review
          path: review.json
