name: Build site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build site
        run: ./scripts/build-site.sh
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
