name: Push formatting
on:
  workflow_run:
    workflows: ["Format"]
    types: [completed]
permissions: {}
jobs:
  push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download result
        uses: actions/download-artifact@v8
        with:
          name: format-result
          path: ${{ runner.temp }}/format-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Apply and push
        env:
          TARGET_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          git apply "$RUNNER_TEMP/format-result/format.patch"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Apply formatting"
          git push origin "HEAD:refs/heads/$TARGET_REF"
