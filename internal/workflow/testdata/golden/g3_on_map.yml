on:
  pull_request:
    types: [opened, synchronize]
  workflow_run:
    workflows: [Build, Test]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: ref to build
        required: true
        type: string
      dry-run:
        type: boolean
  workflow_call:
    inputs:
      target:
        type: string
        required: false
      count:
        type: number
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
