name: Checkout persistence
on:
  workflow_call:
    inputs:
      persist:
        type: string
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ inputs.persist }}
