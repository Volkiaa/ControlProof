name: Secrets and inherit
on: push
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    if: secrets.deploy_key != ''
    env:
      ALPHA: ${{ secrets.ALPHA }}
    outputs:
      digest: ${{ secrets.OUTPUT_TOKEN }}
    steps:
      - if: secrets.CONDITION == 'yes'
        env:
          BETA: ${{ secrets.BETA }}
        run: echo ${{ secrets.BETA }} ${{ secrets.GITHUB_TOKEN }} ${{ secrets.Token }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ secrets.ARTIFACT_NAME }}
  call:
    uses: octo/repo/.github/workflows/reusable.yml@v1
    secrets: inherit
