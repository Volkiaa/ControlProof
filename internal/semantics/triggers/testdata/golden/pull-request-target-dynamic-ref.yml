name: Dynamic checkout
on:
  pull_request_target:
    types: [labeled]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: pr
        run: echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - name: Checkout resolved ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
